version: '3.9'

services:
    db:
        image: postgres:15
        environment:
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        volumes:
            - db_data:/var/lib/postgresql/data
        ports:
            - '5432:5432'

    redis:
        image: redis:7
        ports:
            - '6379:6379'

    web:
        build: .
        command: python api/manage.py runserver 0.0.0.0:8000
        volumes:
            - .:/app
        ports:
            - '8000:8000'
        environment:
            - DJANGO_SETTINGS_MODULE=api.settings
        depends_on:
            - db
            - redis

    celery:
        build: .
        command: celery -A api worker -l info
        volumes:
            - .:/app
        depends_on:
            - redis
            - db
            - web

    beat:
        build: .
        command: celery -A api beat -l info
        volumes:
            - .:/app
        depends_on:
            - redis
            - web

    scrapy:
        build: .
        working_dir: /app/scraper
        command: bash -c "scrapy crawl sportsbook_spider"
        depends_on:
            - redis

volumes:
    db_data:
