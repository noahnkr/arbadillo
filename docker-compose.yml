services:
    django:
        build:
            context: ./backend
        container_name: arbadillo_api
        command: sh entrypoint.sh
        volumes:
            - ./backend:/app
        ports:
            - '8000:8000'
        env_file:
            - .env
        depends_on:
            - redis

    celery:
        build:
            context: ./backend
        container_name: arbadillo_celery
        command: celery -A celery worker --loglevel=info
        volumes:
            - ./backend:/app
        env_file:
            - .env
        depends_on:
            - django
            - redis

    celery-beat:
        build:
            context: ./backend
        container_name: arbadillo_beat
        command: celery -A celery beat --loglevel=info
        volumes:
            - ./backend:/app
        env_file:
            - .env
        depends_on:
            - django
            - redis

    redis:
        image: redis:7
        container_name: arbadillo_redis
        ports:
            - '6379:6379'

    db:
        image: postgres:15
        container_name: arbadillo_postgres
        restart: always
        volumes:
            - pgdata:/var/lib/postgresql/data
        environment:
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        ports:
            - '5432:5432'
        env_file:
            - .env

volumes:
    pgdata:
