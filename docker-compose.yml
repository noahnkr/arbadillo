services:
    django:
        build:
            context: ./backend
        container_name: api
        command: sh entrypoint.sh
        volumes:
            - ./backend:/app
        ports:
            - '8000:8000'
        env_file:
            - .env
        depends_on:
            - db
            - redis

    celery:
        build:
            context: ./backend
        container_name: celery_worker
        command: celery -A workers worker --loglevel=info --concurrency=4
        volumes:
            - ./backend:/app
        env_file:
            - .env
        depends_on:
            - django
            - redis

    celery-beat:
        build:
            context: ./backend
        container_name: celery_beat
        command: celery -A workers beat --loglevel=info
        volumes:
            - ./backend:/app
        env_file:
            - .env
        depends_on:
            - django
            - redis

    redis:
        image: redis:7
        container_name: redis
        ports:
            - '6379:6379'
    scraper:
        build:
            context: ./backend
        container_name: scraper
        working_dir: /app/scraper
        volumes:
            - ./backend:/app
        entrypoint: ['/bin/bash']
        tty: true
        env_file:
            - .env
        depends_on:
            - redis

    db:
        image: postgres:15
        container_name: postgres
        restart: always
        volumes:
            - pgdata:/var/lib/postgresql/data
        ports:
            - '5432:5432'
        env_file:
            - .env

volumes:
    pgdata:
